
spring.application.name=messaging-service
server.port=8086
management.endpoints.web.exposure.include=health,info,mappings
# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CloudAMQP RabbitMQ
spring.rabbitmq.addresses=amqps://ewqeowcx:AY7TEkPOTe6I68_vqSVsryKgvns4rpzy@puffin.rmq2.cloudamqp.com/ewqeowcx

# RabbitMQ listener
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

internal.auth.api-key=secretkey

logging.file.name=logs/messaging-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/messaging-service-%d{yyyy-MM-dd}.%i.log.gz

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB